# Alembic 配置（M13.5：Postgres + 迁移）
# 注意：sqlalchemy.url 在 migrations/env.py 里从 app.core.config.settings.DATABASE_URL
# 动态设置，保证迁移和运行时用同一个库。这里不写死 url。
[alembic]
script_location = migrations
prepend_sys_path = .
# 迁移文件名带时间戳前缀，便于排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
