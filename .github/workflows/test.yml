name: Test & Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run agent evaluation (no LLM key needed for structure tests)
        run: |
          python -m pytest tests/test_agents_registry.py tests/test_mcp_servers.py tests/test_auth.py -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Type-check + build (vue-tsc + vite)
        # 主要价值：捕获 TS 类型错误和编译错误。
        run: npm run build

      - name: Note if committed dist looks out of sync (non-blocking)
        # dist/ 已提交进 git，供 FastAPI 在 /ui 零构建托管。
        # 只做提示，不阻断——因为不同 Node/vite 环境的产物 hash 可能不同。
        if: always()
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::warning::apps/web/dist 可能与源码不同步；改了前端记得 'npm run build:web' 并提交 dist/"
          else
            echo "✓ dist 与本次构建一致"
          fi
